# Always-on local stack for the Coinbase paper-trading port (cb/): Postgres + the trading engine.
# Both use restart: unless-stopped, so they auto-restart on crash and return after a reboot
# (as long as Docker Desktop is set to start on login).
#   docker compose up -d --build   build + start DB and the cb backend
#   docker compose logs -f cb      follow the engine logs
#   docker compose restart cb      restart just the backend (e.g. after a code change + rebuild)
#   docker compose down            stop everything (data survives in the named volume)
#   docker compose down -v         also remove the volume (wipes all cb data)
# The /paper dashboard is on-demand: `cd web; bun run dev` (it reads NEXT_PUBLIC_PAPER_API_URL).
services:
  db:
    image: postgres:17
    container_name: cb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cb
      POSTGRES_PASSWORD: cb
      POSTGRES_DB: cb
    ports:
      - "5432:5432"
    volumes:
      - cb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cb -d cb"]
      interval: 5s
      timeout: 5s
      retries: 10

  cb:
    build:
      context: .
      dockerfile: Dockerfile.cb
    container_name: cb-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Pull MODEL / AI_GATEWAY_API_KEY / CB_* from the root .env; the two lines below override the
    # host-oriented values so the container reaches Postgres by service name and binds a known port.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://cb:cb@db:5432/cb
      PORT: "3001"
    ports:
      - "3001:3001"

volumes:
  cb-pgdata:
